<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSpark 投机解码 · 交互式代码走读</title>
<!--
  单文件交互讲解页:直接用浏览器打开即可,无需任何依赖。
  内容对应 sglang 源码(行号以走读时的代码版本为准):
    python/sglang/srt/speculative/dspark_components/*
    python/sglang/srt/managers/scheduler.py
    python/sglang/srt/models/deepseek_v4.py 等
  键盘:Space 播放/暂停 · ← / → 单步 · R 重置
-->
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2330;
    --border: #2d3748;
    --text: #dbe4f0;
    --muted: #8b98ab;
    --accent: #58a6ff;
    --accent2: #f0883e;
    --green: #3fb950;
    --red: #f85149;
    --purple: #bc8cff;
    --yellow: #d29922;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; font-weight: 600; white-space: nowrap; }
  header h1 .sub { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  #phaseBadge {
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    background: rgba(88,166,255,.15); color: var(--accent);
    border: 1px solid rgba(88,166,255,.4); white-space: nowrap;
  }
  .controls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .controls button {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 14px; font-size: 13px; cursor: pointer;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  .controls button:hover { background: #263041; border-color: var(--accent); }
  .controls button.primary { background: var(--accent); color: #04101f; border-color: var(--accent); font-weight: 600; }
  .controls button.primary:hover { background: #79b8ff; }
  .controls button:disabled { opacity: .35; cursor: default; }
  #stepIndicator { font-family: var(--mono); font-size: 13px; color: var(--muted); min-width: 56px; text-align: center; }
  select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px; font-size: 13px;
  }
  .kbdhint { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .kbdhint kbd {
    font-family: var(--mono); font-size: 10px; padding: 1px 5px;
    border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px;
    background: var(--panel2); margin: 0 1px;
  }

  /* ---------- 主区 ---------- */
  main { flex: 1; display: flex; min-height: 0; }
  #stage {
    flex: 1.35; display: flex; flex-direction: column; min-width: 0;
    border-right: 1px solid var(--border);
  }
  #archWrap { padding: 6px 10px 0; }
  #arch { width: 100%; height: auto; display: block; }

  /* SVG 架构图 */
  .node rect {
    fill: var(--panel2); stroke: var(--border); stroke-width: 1.2; rx: 9;
    transition: stroke .25s, fill .25s;
  }
  .node text { fill: var(--muted); font-size: 12.5px; text-anchor: middle; transition: fill .25s; }
  .node .nodeSub { font-size: 9.5px; fill: #5b6879; }
  .node.active rect { stroke: var(--accent); fill: #12233c; filter: drop-shadow(0 0 6px rgba(88,166,255,.45)); }
  .node.active text { fill: var(--text); }
  .node.active .nodeSub { fill: var(--accent); }
  .edge {
    stroke: #39434f; stroke-width: 1.6; fill: none;
    marker-end: url(#arrowDim);
    transition: stroke .25s;
  }
  .edge.active {
    stroke: var(--accent); marker-end: url(#arrowLit);
    stroke-dasharray: 7 5;
    animation: flow .7s linear infinite;
    filter: drop-shadow(0 0 3px rgba(88,166,255,.6));
  }
  .edge.activeWarm {
    stroke: var(--accent2); marker-end: url(#arrowWarm);
    stroke-dasharray: 7 5;
    animation: flow .7s linear infinite;
    filter: drop-shadow(0 0 3px rgba(240,136,62,.6));
  }
  @keyframes flow { to { stroke-dashoffset: -12; } }
  .edgeLabel { font-size: 9.5px; fill: #5b6879; text-anchor: middle; transition: fill .25s; }
  .edgeLabel.active { fill: var(--accent); }
  .edgeLabel.activeWarm { fill: var(--accent2); }

  /* 微观视图 */
  #micro {
    flex: 1; margin: 8px 10px 10px; padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    overflow: auto; min-height: 0;
  }
  #micro h3 { font-size: 13px; color: var(--accent); margin-bottom: 12px; font-weight: 600; }
  .mrow { display: flex; align-items: center; gap: 6px; margin: 7px 0; flex-wrap: wrap; }
  .mlabel { font-size: 11.5px; color: var(--muted); min-width: 118px; font-family: var(--mono); }
  .tok {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 30px; height: 30px; padding: 0 4px;
    border-radius: 6px; font-family: var(--mono); font-size: 11.5px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--muted);
    animation: pop .4s both;
    position: relative;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(8px) scale(.8); }
    to   { opacity: 1; transform: none; }
  }
  .tok.prefix  { background: #1f2c40; border-color: #33507a; color: #9fc0ea; }
  .tok.slot    { background: transparent; border-style: dashed; border-color: #4a5568; color: #4a5568; }
  .tok.anchor  { background: #3a2c10; border-color: var(--yellow); color: #ffd479; font-weight: 700; }
  .tok.mask    { background: repeating-linear-gradient(45deg, #232a36 0 5px, #1a2029 5px 10px); border-color: #4a5568; color: #7c8798; }
  .tok.draft   { background: #33240f; border-color: var(--accent2); color: #ffb877; }
  .tok.hid     { background: linear-gradient(135deg, #1d3450, #234064); border-color: #3d6db0; color: #a8cdf5; }
  .tok.accept  { background: #12301b; border-color: var(--green); color: #7ee2a0; }
  .tok.reject  { background: #38151a; border-color: var(--red); color: #ff9a94; text-decoration: line-through; }
  .tok.bonus   { background: #2a1e3f; border-color: var(--purple); color: #d9bfff; font-weight: 700; }
  .tok.hole    { background: transparent; border-color: #333c48; border-style: dotted; color: #333c48; }
  .tok.dim     { opacity: .32; }
  .tok.glow    { box-shadow: 0 0 8px rgba(88,166,255,.55); border-color: var(--accent); }

  .confbar { display: inline-flex; align-items: flex-end; gap: 2px; height: 30px; }
  .confbar i {
    display: inline-block; width: 9px; border-radius: 2px 2px 0 0;
    background: linear-gradient(to top, #2f81f7, #79c0ff);
    animation: rise .5s both;
  }
  .confbar i.low { background: linear-gradient(to top, #6e4029, #f0883e); }
  @keyframes rise { from { height: 0 !important; opacity: 0; } }

  .mbox {
    display: inline-block; padding: 8px 14px; margin: 4px 6px 4px 0;
    border: 1px solid var(--border); border-radius: 9px; background: var(--panel2);
    font-size: 12px; animation: pop .45s both;
  }
  .mbox.hl { border-color: var(--accent); color: var(--accent); background: #12233c; }
  .mbox.warm { border-color: var(--accent2); color: var(--accent2); background: #2b1c0e; }
  .mbox .big { font-size: 15px; font-weight: 700; }
  .marrow { display: inline-block; color: var(--muted); margin: 0 8px; font-size: 15px; animation: pop .5s both; }
  .mnote { font-size: 11.5px; color: var(--muted); margin-top: 10px; line-height: 1.7; }
  .mnote b { color: var(--text); }
  .gframe {
    border: 1.5px dashed #3d6db0; border-radius: 10px; padding: 8px 10px;
    display: inline-block; margin: 4px 0; position: relative; animation: pop .5s both;
  }
  .gframe::before {
    content: attr(data-label); position: absolute; top: -9px; left: 12px;
    font-size: 10px; color: #3d6db0; background: var(--panel); padding: 0 6px;
    font-family: var(--mono);
  }

  /* ---------- 右侧讲解 ---------- */
  #explain {
    flex: 1; min-width: 330px; max-width: 480px;
    display: flex; flex-direction: column; background: var(--panel);
    overflow: hidden;
  }
  #explainScroll { flex: 1; overflow-y: auto; padding: 18px 20px 26px; }
  #explain h2 { font-size: 17px; margin-bottom: 4px; line-height: 1.45; }
  #explain h2 .stepNo {
    font-family: var(--mono); color: var(--accent); font-size: 13px;
    margin-right: 8px; vertical-align: 2px;
  }
  .section { margin-top: 16px; animation: fadein .4s both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .section h4 {
    font-size: 12px; text-transform: none; letter-spacing: .4px;
    color: var(--muted); margin-bottom: 7px; display: flex; align-items: center; gap: 6px;
  }
  .section h4::before { content: ""; width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .section.what h4::before { background: var(--accent); }
  .section.why  h4::before { background: var(--accent2); }
  .section.code h4::before { background: var(--purple); }
  .section p, .section li { font-size: 13.5px; line-height: 1.85; color: var(--text); }
  .section ul { padding-left: 18px; }
  .section li { margin: 4px 0; }
  .section code, .mnote code {
    font-family: var(--mono); font-size: 12px; background: #232b38;
    padding: 1px 5px; border-radius: 4px; color: #9fc0ea;
  }
  .codeloc {
    display: block; font-family: var(--mono); font-size: 11.5px;
    background: #10151d; border: 1px solid var(--border); border-radius: 7px;
    padding: 7px 10px; margin: 5px 0; color: #9fc0ea; line-height: 1.55;
  }
  .codeloc span { color: var(--muted); display: block; font-family: inherit; font-size: 11px; }
  .hlterm { color: var(--accent2); font-weight: 600; }

  /* ---------- 底部时间轴 ---------- */
  footer {
    border-top: 1px solid var(--border); background: var(--panel);
    padding: 8px 14px 10px; overflow-x: auto; white-space: nowrap;
  }
  #progressWrap { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 8px; overflow: hidden; }
  #progressBar { height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
  .phaseGroup { display: inline-flex; align-items: center; margin-right: 22px; vertical-align: top; }
  .phaseName { font-size: 11px; color: var(--muted); margin-right: 8px; }
  .dot {
    width: 26px; height: 26px; border-radius: 50%; display: inline-flex;
    align-items: center; justify-content: center; margin: 0 3px;
    font-size: 11px; font-family: var(--mono); cursor: pointer;
    background: var(--panel2); color: var(--muted); border: 1px solid var(--border);
    transition: all .15s;
  }
  .dot:hover { border-color: var(--accent); color: var(--text); }
  .dot.done { background: #12233c; color: #6ea8e8; border-color: #2c4a76; }
  .dot.cur {
    background: var(--accent); color: #04101f; border-color: var(--accent);
    font-weight: 700; transform: scale(1.18);
    box-shadow: 0 0 8px rgba(88,166,255,.6);
  }

  @media (max-width: 980px) {
    main { flex-direction: column; overflow-y: auto; }
    #stage { border-right: none; border-bottom: 1px solid var(--border); }
    #explain { max-width: none; }
  }
</style>
</head>
<body>

<header>
  <h1>DSpark 投机解码<span class="sub">一个新请求的完整链路 · sglang 源码走读</span></h1>
  <span id="phaseBadge"></span>
  <div class="controls">
    <button id="btnReset" title="重置 (R)">⟲ 重置</button>
    <button id="btnPrev" title="上一步 (←)">← 上一步</button>
    <button id="btnPlay" class="primary" title="播放/暂停 (Space)">▶ 播放</button>
    <button id="btnNext" title="下一步 (→)">下一步 →</button>
    <span id="stepIndicator"></span>
    <select id="speedSel" title="播放速度">
      <option value="1.6">慢速</option>
      <option value="1" selected>常速</option>
      <option value="0.55">快速</option>
    </select>
    <span class="kbdhint"><kbd>Space</kbd>播放 <kbd>←</kbd><kbd>→</kbd>单步 <kbd>R</kbd>重置</span>
  </div>
</header>

<main>
  <div id="stage">
    <div id="archWrap">
      <svg id="arch" viewBox="0 0 880 330" preserveAspectRatio="xMidYMid meet">
        <defs>
          <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#39434f"/>
          </marker>
          <marker id="arrowLit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
          </marker>
          <marker id="arrowWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/>
          </marker>
        </defs>

        <!-- 边(先画,压在节点下面) -->
        <path id="e_sched_worker"   class="edge" d="M440,62  L440,96"/>
        <path id="e_worker_sched"   class="edge" d="M492,96  C520,80 520,78 492,62"/>
        <path id="e_worker_draft"   class="edge" d="M340,124 L232,124"/>
        <path id="e_worker_target"  class="edge" d="M540,124 L648,124"/>
        <path id="e_worker_planner" class="edge" d="M392,152 L308,206"/>
        <path id="e_worker_verifier" class="edge" d="M488,152 L572,206"/>
        <path id="e_verifier_target" class="edge" d="M636,206 L700,152"/>
        <path id="e_target_inj"     class="edge" d="M700,152 C620,230 520,268 486,282"/>
        <path id="e_inj_draftkv"    class="edge" d="M382,290 L232,290"/>
        <path id="e_draft_draftkv"  class="edge" d="M160,152 L160,266"/>
        <path id="e_target_targetkv" class="edge" d="M712,152 L712,266"/>
        <path id="e_planner_verifier" class="edge" d="M356,224 L524,224"/>

        <text class="edgeLabel" id="l_sched_worker" x="470" y="84">forward_batch_generation</text>
        <text class="edgeLabel" id="l_worker_draft" x="286" y="115">draft 块前向</text>
        <text class="edgeLabel" id="l_worker_target" x="594" y="115">prefill / verify</text>
        <text class="edgeLabel" id="l_target_inj" x="600" y="252">aux hidden</text>
        <text class="edgeLabel" id="l_inj_draftkv" x="307" y="282">投影写入</text>
        <text class="edgeLabel" id="l_planner_verifier" x="440" y="217">RaggedVerifyLayout</text>

        <!-- 节点 -->
        <g class="node" id="n_sched">
          <rect x="340" y="18" width="200" height="44"/>
          <text x="440" y="37">Scheduler</text>
          <text x="440" y="52" class="nodeSub">run_batch · 事件循环</text>
        </g>
        <g class="node" id="n_worker">
          <rect x="340" y="96" width="200" height="56"/>
          <text x="440" y="119">DSparkWorkerV2</text>
          <text x="440" y="136" class="nodeSub">draft → verify → accept 编排</text>
        </g>
        <g class="node" id="n_draft">
          <rect x="88" y="96" width="144" height="56"/>
          <text x="160" y="119">Draft 模型</text>
          <text x="160" y="136" class="nodeSub">少层 + Markov 头</text>
        </g>
        <g class="node" id="n_target">
          <rect x="648" y="96" width="144" height="56"/>
          <text x="720" y="119">目标模型</text>
          <text x="720" y="136" class="nodeSub">DeepSeek-V4 等</text>
        </g>
        <g class="node" id="n_planner">
          <rect x="236" y="200" width="120" height="48"/>
          <text x="296" y="220">VerifyPlanner</text>
          <text x="296" y="236" class="nodeSub">置信度 → 预算</text>
        </g>
        <g class="node" id="n_verifier">
          <rect x="524" y="200" width="132" height="48"/>
          <text x="590" y="220">VerifyExecutor</text>
          <text x="590" y="236" class="nodeSub">compact 验证 + accept</text>
        </g>
        <g class="node" id="n_inj">
          <rect x="382" y="266" width="104" height="48"/>
          <text x="434" y="286">KV Injector</text>
          <text x="434" y="302" class="nodeSub">hidden → KV</text>
        </g>
        <g class="node" id="n_draftkv">
          <rect x="88" y="266" width="144" height="48"/>
          <text x="160" y="286">Draft KV cache</text>
          <text x="160" y="302" class="nodeSub">共用 req_to_token</text>
        </g>
        <g class="node" id="n_targetkv">
          <rect x="648" y="266" width="144" height="48"/>
          <text x="720" y="286">Target KV cache</text>
          <text x="720" y="302" class="nodeSub">token_to_kv_pool</text>
        </g>
      </svg>
    </div>
    <div id="micro"></div>
  </div>

  <div id="explain">
    <div id="explainScroll">
      <h2><span class="stepNo" id="expStepNo"></span><span id="expTitle"></span></h2>
      <div class="section what"><h4>这一步做了什么</h4><div id="expWhat"></div></div>
      <div class="section why"><h4>为什么这么设计(性能 / 显存 / 并发)</h4><div id="expWhy"></div></div>
      <div class="section code"><h4>关键代码位置</h4><div id="expCode"></div></div>
    </div>
  </div>
</main>

<footer>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div id="timeline"></div>
</footer>

<script>
"use strict";

/* ============================================================
 * 微观视图渲染辅助
 * ============================================================ */
const microEl = document.getElementById("micro");

function tok(text, cls, delay) {
  return `<span class="tok ${cls || ""}" style="animation-delay:${(delay || 0)}ms">${text}</span>`;
}
function toks(list, baseDelay, gap) {
  return list.map((t, i) => tok(t[0], t[1], (baseDelay || 0) + i * (gap === undefined ? 45 : gap))).join("");
}
function row(label, inner) {
  return `<div class="mrow"><span class="mlabel">${label}</span>${inner}</div>`;
}
function conf(heights, delay) {
  const bars = heights.map((h, i) =>
    `<i class="${h < 12 ? "low" : ""}" style="height:${h}px;animation-delay:${(delay || 0) + i * 60}ms"></i>`).join("");
  return `<span class="confbar">${bars}</span>`;
}
function box(text, cls, delay) {
  return `<span class="mbox ${cls || ""}" style="animation-delay:${(delay || 0)}ms">${text}</span>`;
}
function arrow(delay) { return `<span class="marrow" style="animation-delay:${(delay || 0)}ms">→</span>`; }
function note(html) { return `<div class="mnote">${html}</div>`; }

/* 示例批次:3 个请求,gamma=4(草稿 4 个,验证窗口 5) */
const P = (n, base) => Array.from({length: n}, (_, i) => [`t${(base||0)+i}`, "prefix"]);

/* ============================================================
 * 步骤定义
 * 每步: { phase, title, nodes:[激活节点], edges:[激活边(可带 :warm)],
 *         micro() 微观视图 HTML, what/why HTML, code:[[位置,说明]] }
 * ============================================================ */
const PHASES = ["总览", "初始化", "Prefill · 请求首步", "Decode · 每步循环", "总结"];

const steps = [

/* ---------- 0 总览 ---------- */
{
  phase: 0,
  title: "DSpark 是什么:块式草稿 + 弹性验证的投机解码",
  nodes: ["n_sched","n_worker","n_draft","n_target","n_planner","n_verifier","n_inj","n_draftkv","n_targetkv"],
  edges: [],
  micro() {
    return `<h3>登场角色(点击底部时间轴可随时跳转)</h3>
      ${row("推测", toks([["锚点","anchor"],["d1","draft"],["d2","draft"],["d3","draft"],["d4","draft"]], 100))}
      ${row("验证后", toks([["d1","accept"],["d2","accept"],["d3","accept"],["d4","reject"],["bonus","bonus"]], 400))}
      ${note(`投机解码的基本逻辑:便宜的 <b>draft 模型</b>一次猜出 γ 个 token(上排),昂贵的<b>目标模型</b>一次前向并行验证(下排):
        连续猜对的部分(绿)直接提交,第一个猜错处(红)由目标模型给出正确的 <b>bonus</b> token。
        一步最多前进 γ+1 个 token,最少 1 个(bonus),<b>输出分布与目标模型逐 token 解码完全一致</b>。<br><br>
        DSpark 的三个关键差异:① draft 不做 γ 次自回归小步,而是<b>一次块式前向</b>并行填 γ 个 [MASK];
        ② draft 不重算 prompt,直接<b>复用目标模型中间层 hidden</b> 作为自己的 KV;

      ${note(`绿 = 目标模型同意的草稿;红 = 第一个分歧点;<b>紫 = bonus</b>:分歧位置上目标模型自己的输出——
        它不是"补偿",而是本来就要生成的 token,所以每步<b>至少净赚 1 个 token</b>,最坏情况也不慢于普通解码。
        灰 = 根本没被验证的草稿(裁剪所致),<code>cutoff_layout</code> 保证接受长度不越过各自的验证边界。<br>
        采样(非贪心)时用<b>拒绝采样</b>逐位置判定,数学上保证输出分布与目标模型逐 token 采样严格一致;
        混合批次由 <code>SelectMixedAccept</code> 按请求分流。`)}`;
  },
  what: `<p><code>accept_draft_tokens</code> 逐位置比较目标 logits 与草稿:贪心请求比 argmax,采样请求走拒绝采样,得到每请求的连续命中长度 <code>correct_len</code>、分歧处的 <code>bonus</code> token,以及被验证边界截断的 <code>cap_trim_lens</code>。</p>`,
  why: `<ul>
    <li><b>正确性根基</b>:接受规则(前缀匹配 + 拒绝采样)保证无论 draft 猜得多差,最终输出分布恒等于目标模型独立解码——draft 只影响速度,不影响质量。</li>
    <li><b>性能</b>:判定全程 GPU batch 化(无逐请求 host 循环),输出是定形状张量;贪心路径 <code>AcceptGreedy</code> 是一次融合 kernel。</li>
    <li><b>观测旁路</b>:<code>SGLANG_SIMULATE_ACC_LEN</code> 可强制固定接受长度,用于剥离模型质量、单测调度/内核性能。</li>
  </ul>`,

{

/* ============================================================
 * 驱动逻辑:播放 / 单步 / 重置 / 键盘
 * ============================================================ */
const allNodes = ["n_sched","n_worker","n_draft","n_target","n_planner","n_verifier","n_inj","n_draftkv","n_targetkv"];
const allEdges = ["e_sched_worker","e_worker_sched","e_worker_draft","e_worker_target","e_worker_planner",
                  "e_worker_verifier","e_verifier_target","e_target_inj","e_inj_draftkv",
                  "e_draft_draftkv","e_target_targetkv","e_planner_verifier"];
const edgeLabels = { e_sched_worker:"l_sched_worker", e_worker_draft:"l_worker_draft",
                     e_worker_target:"l_worker_target", e_target_inj:"l_target_inj",
                     e_inj_draftkv:"l_inj_draftkv", e_planner_verifier:"l_planner_verifier" };

let cur = 0;
let playing = false;
let playTimer = null;
let progressTimer = null;
const BASE_STEP_MS = 9000;

const $ = (id) => document.getElementById(id);
const btnPlay = $("btnPlay"), btnNext = $("btnNext"), btnPrev = $("btnPrev"), btnReset = $("btnReset");
const speedSel = $("speedSel");

function speedFactor() { return parseFloat(speedSel.value); }

function renderTimeline() {
  const tl = $("timeline");
  const groups = {};
  steps.forEach((s, i) => { (groups[s.phase] = groups[s.phase] || []).push(i); });
  tl.innerHTML = Object.keys(groups).map(ph =>
    `<span class="phaseGroup"><span class="phaseName">${PHASES[ph]}</span>` +
    groups[ph].map(i => `<span class="dot" data-i="${i}">${i}</span>`).join("") +
    `</span>`).join("");
  tl.querySelectorAll(".dot").forEach(d => d.addEventListener("click", () => goto(parseInt(d.dataset.i, 10))));
}

function updateTimeline() {
  document.querySelectorAll(".dot").forEach(d => {
    const i = parseInt(d.dataset.i, 10);
    d.classList.toggle("cur", i === cur);
    d.classList.toggle("done", i < cur);
  });
}

function renderStep() {
  const s = steps[cur];

  // 架构图高亮
  allNodes.forEach(n => $(n).classList.toggle("active", s.nodes.includes(n)));
  allEdges.forEach(e => {
    const el = $(e);
    el.classList.remove("active", "activeWarm");
    const lbl = edgeLabels[e] && $(edgeLabels[e]);
    if (lbl) lbl.classList.remove("active", "activeWarm");
  });
  s.edges.forEach(spec => {
    const warm = spec.endsWith(":warm");
    const id = warm ? spec.slice(0, -5) : spec;
    const el = $(id);
    if (el) el.classList.add(warm ? "activeWarm" : "active");
    const lbl = edgeLabels[id] && $(edgeLabels[id]);
    if (lbl) lbl.classList.add(warm ? "activeWarm" : "active");
  });

  // 微观视图(重建以重放入场动画)
  microEl.innerHTML = s.micro();

  // 右侧讲解
  $("expStepNo").textContent = `STEP ${cur}`;
  $("expTitle").textContent = s.title;
  $("expWhat").innerHTML = s.what;
  $("expWhy").innerHTML = s.why;
  $("expCode").innerHTML = s.code.map(c =>
    `<span class="codeloc">${c[0]}<span>${c[1]}</span></span>`).join("");
  document.querySelectorAll("#explain .section").forEach(el => {
    el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
  });
  $("explainScroll").scrollTop = 0;

  // 顶栏状态
  $("phaseBadge").textContent = PHASES[s.phase];
  $("stepIndicator").textContent = `${cur + 1} / ${steps.length}`;
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;
  updateTimeline();
}

function goto(i) {
  cur = Math.max(0, Math.min(steps.length - 1, i));
  renderStep();
  try { history.replaceState(null, "", `#step=${cur}`); } catch (e) { /* 沙箱环境可能禁止,忽略 */ }
  if (playing) scheduleNext();   // 手动跳转后重新计时
  else clearProgress();
}

function next() { if (cur < steps.length - 1) goto(cur + 1); else stopPlay(); }
function prev() { if (cur > 0) goto(cur - 1); }
function reset() { stopPlay(); goto(0); }

function clearProgress() {
  if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
  $("progressBar").style.width = playing ? $("progressBar").style.width : "0";
  if (!playing) $("progressBar").style.width = "0";
}

function scheduleNext() {
  if (playTimer) clearTimeout(playTimer);
  clearProgress();
  const dur = BASE_STEP_MS * speedFactor();
  const t0 = performance.now();
  progressTimer = setInterval(() => {
    const p = Math.min(1, (performance.now() - t0) / dur);
    $("progressBar").style.width = (p * 100) + "%";
  }, 80);
  playTimer = setTimeout(() => {
    if (cur < steps.length - 1) { goto(cur + 1); }
    else stopPlay();
  }, dur);
}

function startPlay() {
  if (cur === steps.length - 1) goto(0);
  playing = true;
  btnPlay.textContent = "⏸ 暂停";
  btnPlay.classList.remove("primary");
  scheduleNext();
}

function stopPlay() {
  playing = false;
  btnPlay.textContent = "▶ 播放";
  btnPlay.classList.add("primary");
  if (playTimer) { clearTimeout(playTimer); playTimer = null; }
  clearProgress();
}

btnPlay.addEventListener("click", () => playing ? stopPlay() : startPlay());
btnNext.addEventListener("click", () => { stopPlay(); next(); });
btnPrev.addEventListener("click", () => { stopPlay(); prev(); });
btnReset.addEventListener("click", reset);
speedSel.addEventListener("change", () => { if (playing) scheduleNext(); });

document.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "SELECT" || ev.target.tagName === "INPUT") return;
  switch (ev.code) {
    case "Space":      ev.preventDefault(); playing ? stopPlay() : startPlay(); break;
    case "ArrowRight": ev.preventDefault(); stopPlay(); next(); break;
    case "ArrowLeft":  ev.preventDefault(); stopPlay(); prev(); break;
    case "KeyR":       ev.preventDefault(); reset(); break;
    case "Home":       ev.preventDefault(); stopPlay(); goto(0); break;
    case "End":        ev.preventDefault(); stopPlay(); goto(steps.length - 1); break;
  }
});

renderTimeline();
// 支持 #step=N 深链直达某一步
const hashMatch = location.hash.match(/step=(\d+)/);
if (hashMatch) cur = Math.max(0, Math.min(steps.length - 1, parseInt(hashMatch[1], 10)));
renderStep();
</script>
